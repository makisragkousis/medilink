services:
  mysql:
    image: mysql:8.0
    container_name: medilink_mysql
    restart: always
    ports:
      - "${DB_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: medilink_keycloak
    command: start-dev
    ports:
      - "${KC_PORT}:8080"
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    volumes:
      - keycloak_data:/opt/keycloak/data

  floci:
    image: floci/floci:latest
    container_name: medilink_floci
    restart: always
    ports:
      - "${FLOCI_PORT}:4566"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - floci_data:/var/lib/floci

  mailpit:
    image: axllent/mailpit
    container_name: medilink_mailpit
    restart: always
    ports:
      - "${MAIL_UI_PORT}:8025"
      - "${MAIL_PORT}:1025"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: medilink_rabbitmq
    restart: always
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_UI_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  mysql_data:
  keycloak_data:
  floci_data:
  rabbitmq_data: